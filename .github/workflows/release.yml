name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ('${{ github.ref_type }}' -eq 'tag' -and "v$v" -ne '${{ github.ref_name }}') {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $v"
          }

      # sherpa-onnx-sys copies its DLLs into target/release only when its build script runs, and
      # rust-cache drops loose files from target/release; cleaning just that crate forces the copy.
      # Its build script also trusts any existing target/sherpa-onnx-prebuilt/<ver>/lib dir, which
      # a restored cache can leave without its .lib files, so that goes too (logged first).
      - name: Build
        shell: pwsh
        run: |
          cargo clean --release -p sherpa-onnx-sys
          if (Test-Path target/sherpa-onnx-prebuilt) {
            Get-ChildItem target/sherpa-onnx-prebuilt -Recurse | ForEach-Object { $_.FullName }
            Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt
          }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($dll in 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll') {
            if (-not (Test-Path "target/release/$dll")) { throw "missing target/release/$dll" }
          }

      - name: Test
        shell: pwsh
        run: |
          # the ONNX tests crash on System32's older onnxruntime.dll unless the bundled DLLs sit next to the test binaries
          Copy-Item target/release/*.dll target/release/deps/
          cargo test --release --locked --bin murmur
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # no model on CI: this prints "model not installed; skipping" and proves nothing here
          cargo test --release --locked --test stt_integration -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $name = "murmur-v${{ steps.ver.outputs.version }}-windows-x64"
          $files = @('murmur.exe', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll') |
            ForEach-Object { "target/release/$_" }
          foreach ($doc in 'README.md', 'LICENSE') {
            if (Test-Path $doc) { $files += $doc }
            elseif ('${{ github.ref_type }}' -eq 'tag') { throw "$doc is required for a release" }
          }
          Compress-Archive -Path $files -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF, so `sha256sum -c` works on Linux and Git Bash
          [IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
          "name=$name" >> $env:GITHUB_OUTPUT

      # not preinstalled on windows-2025 (actions/runner-images #11644, #12947)
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build installer
        id: setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\murmur.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $name = "murmur-v${{ steps.ver.outputs.version }}-setup.exe"
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$name.sha256", "$hash  $name`n")
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sha256
            ${{ steps.setup.outputs.name }}
            ${{ steps.setup.outputs.name }}.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match Cargo.toml version $v"; exit 1; }

      # the same cache trap as on Windows: sherpa-onnx-sys copies its dylibs only when its build script runs
      - name: Build
        run: |
          cargo clean --release -p sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
          cargo build --release --locked

      - name: Test
        run: |
          cargo test --release --locked --bin murmur
          cargo test --release --locked --lib

      # With the MACOS_CERT_P12 secret (a base64 .p12 holding the Developer ID Application certificate and
      # its key) and MACOS_CERT_PASSWORD, bundle.sh signs with it. With the NOTARY_* secrets as well,
      # dmg.sh notarizes and staples the DMG. Without them (forks, a missing secret) both fall back to
      # ad hoc signing and no notarization.
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no MACOS_CERT_P12 secret: signing ad hoc"
            exit 0
          fi
          kc="$RUNNER_TEMP/murmur.keychain-db"
          kc_pw=$(uuidgen)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "MURMUR_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_PASSWORD" ]; then
            xcrun notarytool store-credentials murmur-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
            echo "MURMUR_NOTARY_PROFILE=murmur-notary" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: |
          ./scripts/macos/bundle.sh
          ./scripts/macos/dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            murmur-v*-macos-*.dmg
            murmur-v*-macos-*.dmg.sha256

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # .github/release-notes.md goes above GitHub's generated list of merged PRs
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --generate-notes --notes-file src/.github/release-notes.md --title "Murmur ${{ github.ref_name }}" murmur-v*
