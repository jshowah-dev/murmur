[package]
name = "murmur"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "murmur"
path = "src/main.rs"

[dependencies]
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }
cpal = "0.16"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
] }
tray-icon = "0.24"
rphonetic = "4"
similar = "3"
toml = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "7"
anyhow = "1"
log = "0.4"
simplelog = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
members = [".", "probe"]
