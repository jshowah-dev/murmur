[package]
name = "murmur"
version = "0.4.4"
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
name = "murmur_lib"
path = "src/lib.rs"

[[bin]]
name = "murmur"
path = "src/main.rs"

[dependencies]
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }
cpal = "0.16"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
] }
tray-icon = "0.24"
rphonetic = "4"
similar = "3"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
toml = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "7"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
members = [".", "probe"]
